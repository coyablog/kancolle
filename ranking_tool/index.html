<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>【艦これ】戰果計算</title>

<style>
  @import url(https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Noto+Serif+TC:wght@100..900&family=Share+Tech+Mono&display=swap);
  :root {
    --navy-deep: #0b1a2e;
    --navy-mid: #12294a;
    --navy-light: #1a3d6b;
    --gold: #c8a84b;
    --gold-light: #e8cc80;
    --steel: #8aa4c0;
    --steel-light: #b8cfe0;
    --white: #f0f4f8;
  }
  *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
  }
  body {
      font-family: "Noto Sans TC", sans-serif;
      background: var(--navy-deep);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
  }
  body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 20% 0%, rgba(26, 61, 107, 0.5) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(18, 41, 74, 0.8) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
  }
  .panel {
      position: relative;
      width: 480px;
      background: var(--navy-mid);
      border: 1px solid rgba(138, 164, 192, 0.25);
      border-top: 2px solid var(--gold);
      border-radius: 5px;
      padding: 1.5%;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      animation: rise 0.45s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 1;
  }
  .panel::before, .panel::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.5;
      transition: opacity 0.2s;
  }
  .panel::before {
      bottom: 8px;
      right: 8px;
      border-width: 0 1.5px 1.5px 0;
  }
  .panel::after {
      bottom: 8px;
      left: 8px;
      border-width: 0 0 1.5px 1.5px;
  }
  @keyframes rise {
      from {
          opacity: 0;
          transform: translateY(16px);
      }
      to {
          opacity: 1;
          transform: translateY(0);
      }
  }
  header {
      position: relative;
      z-index: 10;
      margin-bottom: 5%;
      padding-bottom: 5%;
      border-bottom: 1px solid rgba(200, 168, 75, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
  }
  header .header-anchor {
      position: absolute;
      left: 30px;
  }
  header > div {
      text-align: center;
  }
  header h1 {
      font-family: "Noto Serif TC", serif;
      font-size: 22px;
      font-weight: bold;
      color: var(--gold-light);
      letter-spacing: 0.1em;
  }
  header .subtitle {
      font-size: 13px;
      color: var(--steel);
      margin-top: 2.5%;
      letter-spacing: 0.05em;
  }
  #today {
      font-family: "Share Tech Mono", monospace;
      font-size: 13px;
      color: var(--steel);
      letter-spacing: 0.06em;
      margin-top: 2.5%;
  }
  .header-anchor {
      width: 44px;
      height: 44px;
      background: var(--navy-light);
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
  }
  .header-anchor:hover {
      background: rgba(200, 168, 75, 0.15);
      box-shadow: 0 0 12px rgba(200, 168, 75, 0.3);
  }
  .header-anchor svg {
      width: 22px;
      height: 22px;
  }

  .field {
      margin-bottom: 3.5%;
  }
  label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--steel);
      text-transform: uppercase;
      margin-bottom: 1.5%;
  }
  input[type="number"] {
      width: 100%;
      height: 50px;
      background: var(--navy-deep);
      border: 1px solid rgba(138, 164, 192, 0.25);
      border-radius: 3px;
      color: var(--white);
      font-family: "Share Tech Mono", monospace;
      font-size: 25px;
      padding: 0 2.5%;
      outline: none;
  }
  input[type="number"]:focus {
      border-color: var(--steel-light);
      box-shadow: 0 0 0 2px rgba(184, 207, 224, 0.15);
  }
  input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
  }
  .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 5% 0;
  }
  .stat {
      height: 65px;
      background: var(--navy-light);
      border: 1px solid rgba(138, 164, 192, 0.25);
      border-left: 2px solid var(--gold);
      border-radius: 3px;
      padding: 3.5%;
  }
  .stat.hl {
      border-left-color: var(--steel-light);
  }
  .stat-label {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.1em;
      color: var(--steel);
      text-transform: uppercase;
      margin-bottom: 3.5%;
  }
  .stat-value {
      font-family: "Share Tech Mono", monospace;
      font-size: 25px;
      color: var(--white);
      line-height: 1;
  }
  .stat.hl .stat-value {
      color: var(--steel-light);
  }
  .prog-wrap {
      margin-top: 5%;
  }
  .prog-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.5%;
  }
  .prog-lbl {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.1em;
      color: var(--steel);
      text-transform: uppercase;
  }
  #prog-pct {
      font-family: "Share Tech Mono", monospace;
      font-size: 14px;
      color: var(--gold-light);
  }
  .prog-track {
      height: 10px;
      background: var(--navy-light);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(138, 164, 192, 0.25);
  }
  .prog-bar {
      height: 100%;
      border-radius: 5px;
      background: linear-gradient(to right, var(--steel-light), var(--gold-light));
      width: 0%;
      transition: width 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 0 6px rgba(200, 168, 75, 0.4);
  }
  .tip {
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--steel);
      text-transform: uppercase;
      margin-top: 3.5%;
  }
</style>
</head>
<body>
<div class="panel">
<header>
<a class="header-anchor" href="../" title="返回首頁"><svg viewbox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
<path d="M0 16q0 2.624 0.8 5.056t2.304 4.416 3.456 3.456 4.416 2.304 5.024 0.8q2.624 0 5.056-0.8t4.416-2.304 3.424-3.456 2.304-4.416 0.8-5.056v-4l-8 8h3.296q-1.088 3.072-3.552 5.152t-5.728 2.656v-9.792h1.984q0.832 0 1.408-0.576t0.608-1.44-0.608-1.408-1.408-0.576h-1.984v-2.368q1.76-0.608 2.88-2.144t1.12-3.488q0-2.24-1.504-3.936t-3.712-1.984q-0.416-0.096-0.8-0.096t-0.8 0.096q-2.208 0.32-3.712 1.984t-1.472 3.936q0 1.92 1.088 3.456t2.912 2.176v2.368h-2.016q-0.832 0-1.408 0.576t-0.576 1.408 0.576 1.44 1.408 0.576h2.016v9.792q-3.264-0.544-5.728-2.656t-3.584-5.152h3.296l-8-8v4zM14.016 6.016q0-0.832 0.576-1.408t1.408-0.608 1.408 0.608 0.608 1.408-0.608 1.408-1.408 0.576-1.408-0.576-0.576-1.408z" fill="#c8a84b"></path>
</svg></a>
<div>
<h1>【艦これ】戰果計算</h1>
<div id="today"></div>
</div>
</header>
<div class="field"><label>目標戰果</label> <input id="target" placeholder="0" type="number"></div>
<div class="field"><label>目前戰果</label> <input id="current" placeholder="0" type="number"></div>
<div class="result-grid">
<div class="stat">
<div class="stat-label">剩餘刷新</div>
<div class="stat-value" id="v-refresh">—</div>
</div>
<div class="stat">
<div class="stat-label">剩餘戰果</div>
<div class="stat-value" id="v-remain">—</div>
</div>
<div class="stat hl">
<div class="stat-label">每場需求</div>
<div class="stat-value" id="v-per-run">—</div>
</div>
<div class="stat hl">
<div class="stat-label">每日需求</div>
<div class="stat-value" id="v-per-day">—</div>
</div>
</div>
<div class="prog-wrap">
<div class="prog-header"><span class="prog-lbl">完成進度</span> <span id="prog-pct">0%</span></div>
<div class="prog-track">
<div class="prog-bar" id="bar"></div>
</div>
</div>
<div class="tip">輸入數值自動計算</div>
</div>
<script>
  /* ── 日期 ── */
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  document.getElementById("today").textContent =
    today.toLocaleDateString("zh-TW", { year:"numeric", month:"long", day:"numeric", weekday:"short" });

  /* ── 讀取儲存值 ── */
  window.addEventListener("load", () => {
    const t = localStorage.getItem("wf_target");
    const c = localStorage.getItem("wf_current");
    if (t) document.getElementById("target").value  = t;
    if (c) document.getElementById("current").value = c;
    calc();
  });

  document.getElementById("target").addEventListener("input", calc);
  document.getElementById("current").addEventListener("input", calc);

  const trunc2 = n => Math.floor(n * 100) / 100;

  function calc() {
    const target  = Number(document.getElementById("target").value)  || 0;
    const current = Number(document.getElementById("current").value) || 0;

    localStorage.setItem("wf_target",  target);
    localStorage.setItem("wf_current", current);

    const end          = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    const remainDays   = Math.floor((end - today) / 864e5) + 1;

    const now = new Date();
    const r1  = new Date(today); r1.setHours(1,  0, 0, 0);
    const r2  = new Date(today); r2.setHours(13, 0, 0, 0);
    const todayLeft    = now < r1 ? 2 : now < r2 ? 1 : 0;
    const totalRefresh = remainDays * 2 - (2 - todayLeft);

    const remain = target - current;
    const perRun = totalRefresh > 0 ? trunc2(remain / totalRefresh)     : remain;
    const perDay = totalRefresh > 0 ? trunc2(remain / totalRefresh * 2) : remain * 2;
    const pct    = target > 0 ? Math.min(current / target * 100, 100) : 0;

    document.getElementById("v-refresh").textContent = totalRefresh;
    document.getElementById("v-remain").textContent  = remain;
    document.getElementById("v-per-run").textContent = perRun;
    document.getElementById("v-per-day").textContent = perDay;
    document.getElementById("prog-pct").textContent  = trunc2(pct) + "%";
    document.getElementById("bar").style.width       = pct + "%";
  }
</script>
</body>
</html>
